org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Reuse task outputs across runs. On CI this is what makes a second build
# cheap: setup-gradle caches the Gradle user home, the local build cache lives
# inside it, and a commit touching one Kotlin file no longer recompiles and
# re-processes everything. Locally it does the same across branches.
org.gradle.caching=true

# Two modules' worth of work is not much, but the Android tasks and the unit
# test compile do overlap.
org.gradle.parallel=true

# Deliberately NOT org.gradle.configuration-cache. AGP and the Kotlin plugin
# support it, but a problem there fails the build rather than degrading, and a
# publish pipeline is the wrong place to find that out. The build cache above
# is where the time actually is.
