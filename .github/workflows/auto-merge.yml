name: auto-merge

# Merges a pull request once BOTH platform workflows pass on it.
#
# GitHub's own auto-merge needs "Allow auto-merge" plus a branch protection
# rule naming a required check, and both are paid-plan features on a private
# repository. This does the same job with nothing but a workflow.
#
# workflow_run always executes the copy of this file on the DEFAULT BRANCH, not
# the one in the pull request. So edits here take effect only once merged —
# including this one, which is why a change to this file has to be merged by
# hand the first time.
#
# Both platform workflows trigger it. Whichever finishes LAST does the merge:
# each run re-checks that every required check is green, and a run that finds
# one still in progress simply exits — the other workflow's completion will
# bring it back. Waiting by polling would be the alternative, and polling for
# minutes on every PR is how a merge queue becomes the slowest part of the day.
on:
  workflow_run:
    workflows: ["android", "ios"]
    types: [completed]

# A permissions block REPLACES the defaults rather than adding to them, so
# every scope this job touches has to be listed. Leaving one out does not fail
# loudly: the call 403s with "Resource not accessible by integration", naming
# only the endpoint. That is how `checks` went missing here for four runs.
permissions:
  contents: write        # perform the merge
  pull-requests: write   # read PR state, merge
  checks: read           # list the commit's other check runs
  actions: write         # dispatch the publish run, see the last step

jobs:
  merge:
    # Only PR runs, and only passing ones. Excluding workflow_dispatch here is
    # also what stops the dispatch at the end of this job from looping back
    # round into another merge.
    #
    # And only branches in THIS repository. A fork's pull request raises the
    # same workflow_run event with the same conclusion, so without the third
    # line a stranger's PR merges itself the moment both platforms report
    # green. The merge is not where that would stop: the last step of this job
    # then dispatches the publish, which signs an APK with the committed key
    # and ships it to every installed phone. Nothing in between asks who wrote
    # it.
    #
    # claude-autofix.yml has carried this same condition from the start, and
    # the asymmetry was backwards — the workflow that pushes to an existing
    # branch was fenced, and the one that writes to main was not. It cost
    # nothing while the repository was private, because nobody outside could
    # open a pull request at all. That is what changed.
    #
    # A fork's PR still builds and still reports. It just needs a person to
    # merge it, which is the point.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Earlier runs died on their first API call with a bare
      # "Resource not accessible by integration (HTTP 403)", which names
      # neither the endpoint's requirement nor what the token actually holds.
      # GitHub returns both in headers on the 403, so ask and print them
      # instead of guessing at settings. Deliberately never fails the job.
      - name: Report what this token can reach
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PAYLOAD_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          echo "pull_requests in the event payload: $PAYLOAD_PRS"
          for ep in "repos/$REPO" "repos/$REPO/commits/$SHA/pulls" "repos/$REPO/pulls?state=open"; do
            echo "--- GET $ep"
            gh api "$ep" -i 2>&1 \
              | grep -iE "^HTTP/|^x-accepted-github-permissions|^x-oauth-scopes|\"message\"" \
              | head -4 || true
          done

      - name: Merge if the PR is ready and every other check passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          # The run that just went green. Handed to the publish dispatch below
          # so it can republish that run's APK rather than build the same code
          # again; android.yml decides whether it may, by comparing the tree.
          RUN_ID: ${{ github.event.workflow_run.id }}
          # The event already names the pull requests this run belongs to, for
          # same-repo PRs. Reading it costs no API call and no permission,
          # which is the difference between working and 403 if the token turns
          # out to be short of pull-requests scope.
          PAYLOAD_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -uo pipefail

          PR="$PAYLOAD_PR"
          if [ -z "$PR" ]; then
            echo "Event payload carried no PR number; asking the API."
            PR=$(gh api "repos/$REPO/commits/$SHA/pulls" \
                   --jq '[.[] | select(.state == "open")][0].number // empty') || PR=""
          fi
          if [ -z "$PR" ]; then
            echo "No open pull request for $SHA — nothing to merge."
            exit 0
          fi
          echo "Considering PR #$PR"

          # Each guard below is skipped rather than fatal when the lookup
          # itself fails: a job that can read enough to merge but not enough to
          # check a label should still merge, and the platform runs — the checks
          # that actually gate what reaches a device — have already passed.
          #
          # Skipping has to be driven by gh's EXIT STATUS, not by whether the
          # output is empty. On an error gh prints the API's JSON to stdout, so
          # `x=$(gh ... ) || x=""` still captures that body — which is how a
          # 403 on the check-runs call below came out looking like the name of
          # a failing check, and silently held up a merge while reporting
          # success.
          DRAFT=""
          if OUT=$(gh api "repos/$REPO/pulls/$PR" --jq .draft 2>/dev/null); then DRAFT="$OUT"; fi
          if [ "$DRAFT" = "true" ]; then
            echo "PR #$PR is a draft — leaving it alone."
            exit 0
          fi

          # Escape hatch: label a PR no-auto-merge to hold it open.
          LABELS=""
          if OUT=$(gh api "repos/$REPO/pulls/$PR" --jq '[.labels[].name] | join(" ")' 2>/dev/null); then
            LABELS="$OUT"
          fi
          for l in $LABELS; do
            if [ "$l" = "no-auto-merge" ]; then
              echo "PR #$PR is labelled no-auto-merge — leaving it alone."
              exit 0
            fi
          done

          # Both platforms have to have reported, and reported green, before
          # anything merges. A feature lands on Android AND iOS or it is not
          # finished (see CLAUDE.md), and a merge gate that only ever asked one
          # of them would make that rule advisory.
          #
          # By NAME, because these are the job names and therefore the check-run
          # names: `build` in android.yml, `ios-core` and `ios-app` in ios.yml.
          # Renaming any of them silently stops this waiting for it — which is
          # why both files say so next to the job.
          #
          # Missing counts as not-yet, not as absent. A check that has not
          # reported is one still queued, and merging past it is exactly the
          # race this exists to lose.
          #
          # `ios-app` is here rather than left informational, and the reason is
          # arithmetic: it runs on a macOS runner and takes minutes, while
          # `build` and `ios-core` finish in one or two. Left out of this list
          # it would essentially ALWAYS report after the merge had happened, so
          # a broken iOS app would land on main every time rather than
          # occasionally. It skips itself on changes that don't touch ios/**,
          # and a skipped check counts as passing below — which is exactly why
          # it filters with a job-level `if` rather than a path filter on the
          # workflow, since a path-filtered workflow reports nothing and this
          # loop would wait for it forever.
          REQUIRED="build ios-core ios-app"
          if RUNS=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.status == "completed")
                   | select([.conclusion] | inside(["success","neutral","skipped"]))
                   | .name] | join(" ")' 2>/dev/null); then
            for want in $REQUIRED; do
              case " $RUNS " in
                *" $want "*) ;;
                *) echo "Waiting for $want to finish and pass — not merging yet."; exit 0 ;;
              esac
            done
          else
            echo "Could not read the commit's check runs; proceeding on this run's result alone."
          fi

          # And anything else reporting on the commit — the Cloudflare Workers
          # build, whatever gets added later — gets a say too. Checks still
          # running are not counted here: the required ones are handled above,
          # and waiting on the rest would mean polling.
          FAILED=""
          if OUT=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
            --jq '[.check_runs[]
                   | select(.status == "completed")
                   | select([.conclusion] | inside(["success","neutral","skipped"]) | not)
                   | .name] | join(", ")' 2>/dev/null); then
            FAILED="$OUT"
          else
            echo "Could not read the commit's check runs; proceeding on the android result alone."
          fi
          if [ -n "$FAILED" ]; then
            echo "Not merging PR #$PR — failing checks: $FAILED"
            exit 0
          fi

          echo "Merging PR #$PR"
          gh pr merge "$PR" --repo "$REPO" --merge

          # A push made with GITHUB_TOKEN deliberately does not trigger further
          # workflow runs, which would leave this merge sitting on main with no
          # build and no published release — a change that never reaches a
          # single device, silently. Kick the publish off by hand; android.yml
          # carries workflow_dispatch for exactly this.
          #
          # But only when the app actually changed. android.yml's push trigger
          # is path-filtered to android/**; a workflow_dispatch is not, so
          # every merge was publishing a new build — a docs-only PR shipped a
          # fresh versionCode to every installed device, an update with nothing
          # in it. This applies the same filter the push trigger uses.
          #
          # Failing to read the file list means publishing anyway. The wrong
          # direction to be wrong in is the one where an app change quietly
          # never ships.
          PUBLISH=yes
          if FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>/dev/null); then
            PUBLISH=no
            for f in $FILES; do
              case "$f" in
                android/*|.github/workflows/android.yml) PUBLISH=yes ;;
              esac
            done
          else
            echo "Could not list PR #$PR's files; publishing rather than risk not shipping."
          fi

          if [ "$PUBLISH" = "yes" ]; then
            # Offer this run's build to the publish. It is only taken if main's
            # tree turns out to be the tree that run built — i.e. if nothing
            # else merged in between — so passing it is never wrong, only
            # sometimes ignored.
            echo "Dispatching the publish build on main, offering run $RUN_ID's APK"
            gh workflow run android.yml --repo "$REPO" --ref main -f reuse_run_id="$RUN_ID"
          else
            echo "PR #$PR touched nothing under android/ — not publishing a build."
          fi
