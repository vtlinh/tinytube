name: ios

# The iOS half of the shared logic.
#
# A workflow of its own rather than a step inside android.yml, and the reason is
# publishing rather than tidiness. A Swift-only CI change sitting in that file
# would have shipped a new versionCode to every Android device for something
# that cannot affect them.
#
# NO WORKFLOW FILE APPEARS IN ANY PATH FILTER ANY MORE, on either side. The
# filters name android/** and ios/** and nothing else, which is the same
# definition the reuse checks already use — `git rev-parse HEAD:ios` covers
# ios/ alone — so editing CI cannot change either artifact and no longer
# builds or publishes one. See the changes job below.
on:
  push:
    branches: [ "main" ]
    # ios/** and NOTHING ELSE — not even this file. See the changes job.
    paths:
      - "ios/**"
  # Not path-filtered, exactly as in android.yml: a filtered run that doesn't
  # match never reports at all, and auto-merge waits for this one now. A PR
  # touching neither platform would otherwise sit unmerged forever.
  pull_request:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: >-
          A previous ios run whose IPA to publish as-is instead of building a
          new one. Honoured only if that run recorded building the exact ios/
          tree this run checks out; otherwise it is ignored and the build runs
          normally. auto-merge.yml passes the run that just passed on the PR.
        required: false
        default: ""

# contents: write publishes the release. actions: read is what lets this run
# download an artifact belonging to a DIFFERENT run — the reuse path below.
# A permissions block REPLACES the defaults rather than adding to them, so every
# scope any job here touches has to be listed; leaving one out 403s at the call
# rather than failing loudly at the top. See the same note in android.yml.
permissions:
  contents: write
  actions: read
  pull-requests: read   # the `changes` job asks which files a PR touched

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ios-pr-{0}', github.event.number) || 'ios-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job name is the check-run name, and auto-merge.yml requires this exact
  # string before it will merge. Renaming the job silently stops it waiting.
  #
  # Skipped, not absent, when nothing under ios/ changed — a Worker-only or
  # Android-only change has no Swift to test. A job skipped by `if` still
  # REPORTS, as `skipped`, which auto-merge counts as passing; a path filter on
  # the workflow would report nothing and hang the merge.
  ios-core:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TinyTubeCore is a Swift PACKAGE rather than an app target precisely so
      # this can happen on Linux: no Mac, no simulator, no paid account. The
      # rule that a feature lands on both platforms is checked here rather than
      # merely written down in CLAUDE.md.
      - name: Cache the Swift toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: /opt/swift
          key: swift-6.0.3-ubuntu24.04

      - name: Install Swift
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SWIFT=swift-6.0.3-RELEASE-ubuntu24.04
          curl -sSL "https://download.swift.org/swift-6.0.3-release/ubuntu2404/swift-6.0.3-RELEASE/$SWIFT.tar.gz" \
            -o /tmp/swift.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          rm -f /tmp/swift.tar.gz

      - name: Core tests
        run: /opt/swift/usr/bin/swift test --package-path ios/TinyTubeCore

      # A syntax check on the APP target, on the cheap runner.
      #
      # `-parse` stops before type checking, so it never tries to load UIKit,
      # WebKit or ReplayKit and runs perfectly well on Linux. It cannot tell you
      # that an API call is wrong — only ios-app can — but it catches every
      # typo, unbalanced brace and malformed declaration for free.
      #
      # That matters because of how this repository batches: a pull request is
      # opened once the whole request is implemented, so app code can accumulate
      # for a long time with NO local check at all — `swift test` covers only
      # TinyTubeCore. This is the one thing that can be said about
      # ios/TinyTube/** without a Mac, so it is said here rather than nowhere.
      - name: Parse the app target
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(ios/TinyTube/*.swift ios/TinyTubeTests/*.swift)
          if [ ${#FILES[@]} -eq 0 ]; then echo "No app sources yet."; exit 0; fi
          for f in "${FILES[@]}"; do
            echo "parse $f"
            /opt/swift/usr/bin/swiftc -parse "$f"
          done

  # Does this change touch the iOS app at all?
  #
  # A macOS runner bills at 10x, so a free-plan private repository gets about
  # 200 macOS minutes a month. Building the app on every pull request would
  # spend that on Android-only and docs-only changes. This job is seconds on
  # ubuntu and decides whether the expensive one runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      reuse_run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      # Needed by the reuse check below, which compares git's own hash of the
      # ios/ subtree against the one the offered run recorded.
      - uses: actions/checkout@v4

      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # Anything but a pull request builds: a push to main and a manual
          # dispatch are both cases where somebody wants the artifact.
          if [ -z "${PR:-}" ]; then
            echo "Not a pull request — building."
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Failing to read the file list builds anyway. The costly direction to
          # be wrong in is the one where a broken app merges unnoticed; the
          # other direction costs a few minutes. Same reasoning as auto-merge's
          # publish filter, pointed the same way.
          if ! FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>/dev/null); then
            echo "Could not list PR #$PR's files — building rather than risk missing a break."
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WANTED=false
          for f in $FILES; do
            case "$f" in
              # ios/** ONLY, for the reasons written out in android.yml's
              # copy of this filter: the reuse hash covers ios/ and nothing
              # else, so a workflow edit cannot change the IPA, and treating it
              # as one spent a macOS runner to rebuild something identical.
              ios/*) WANTED=true ;;
            esac
          done
          echo "Touches the iOS app: $WANTED"
          echo "ios=$WANTED" >> "$GITHUB_OUTPUT"

      # Can this publish just re-serve the IPA the pull request already built?
      #
      # THIS DECISION IS MADE HERE, ON UBUNTU, and that placement is the whole
      # saving. android.yml can afford to make the same call inside its build
      # job because that job is an ordinary runner; ios-app is macOS and bills
      # at 10x, so starting it merely to discover there is nothing to do would
      # cost about ten minutes of a ~200-minute monthly budget on every single
      # iOS merge. Deciding first means an unchanged tree spends no macOS
      # minutes at all.
      #
      # Same content hash as android.yml uses, pointed at the other subtree:
      # `git rev-parse HEAD:ios` is the SHA git already stores for ios/. If it
      # matches what the offered run wrote into build-tree.txt, that run built
      # this exact source and its IPA is this tree's IPA. If main moved in
      # between, they differ and the build runs — which is also precisely when
      # it must, because no run has compiled the combined tree.
      #
      # So the failure mode is a needless rebuild, never a stale publish.
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          no() { say "$*"; echo "reuse=false" >> "$GITHUB_OUTPUT"; exit 0; }

          [ -n "${RUN_ID:-}" ] || no "No run offered — building."

          if ! gh run download "$RUN_ID" --repo "$REPO" --name tinytube-ipa --dir offered 2>/dev/null; then
            no "Run $RUN_ID has no tinytube-ipa artifact — building instead."
          fi

          BUILT=$(cat offered/build-tree.txt 2>/dev/null || true)
          HERE=$(git rev-parse HEAD:ios)
          if [ -z "$BUILT" ] || [ "$BUILT" != "$HERE" ]; then
            no "Run $RUN_ID built ios/ ${BUILT:-<unrecorded>}; main has $HERE — building instead."
          fi
          test -s offered/TinyTube-unsigned.ipa || no "Run $RUN_ID's artifact has no IPA in it — building instead."

          say "Reusing run $RUN_ID's IPA: tree $HERE. No macOS runner needed."
          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  # Builds the app and produces the IPA the owner sideloads.
  #
  # The job name is the check-run name and auto-merge.yml requires this exact
  # string, exactly as with ios-core above. Renaming it silently stops the merge
  # gate waiting for it.
  #
  # SKIPPED IS THE POINT of the `if` below, and it is why the filtering lives
  # here rather than in this workflow's `on:` block. A job skipped by `if` still
  # reports a check run, with conclusion `skipped`, which auto-merge accepts as
  # passing. A workflow skipped by a PATH FILTER reports nothing at all, and
  # auto-merge would wait for a check that is never coming — the trap already
  # written up next to android.yml's deliberately unfiltered pull_request
  # trigger. Same trap, avoided a different way, because this one has to be
  # cheap as well as present.
  #
  # The second half of that `if` is the publish path, and it is FALSE ON EVERY
  # PULL REQUEST — `reuse_run_id` is a dispatch input and a PR run has none. So
  # a PR still always builds, and the gate is untouched. It can only go true on
  # a dispatched publish whose tree was already built.
  ios-app:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The .xcodeproj is generated rather than committed — see ios/project.yml
      # for why.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        working-directory: ios
        run: xcodegen generate

      # Tests first, so a failure costs the test run rather than the test run
      # plus an archive. The pure logic is already green on Linux by this point;
      # what runs here is only what needs a device to be true.
      - name: Test on a simulator
        working-directory: ios
        run: |
          set -euo pipefail

          # Naming a simulator ("iPhone 16") breaks silently whenever the runner
          # image rotates its device list, and a generic simulator destination
          # is not reliably resolvable for `test`. So ask the image what it
          # actually has and use that device's UDID. Sorted so the newest iOS
          # runtime wins; within one, any iPhone will do.
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=sorted((r,v["udid"]) for r,vs in d.items() if "iOS" in r for v in vs if v.get("isAvailable") and v["name"].startswith("iPhone")); print(c[-1][1] if c else "")')
          test -n "$UDID" || { echo "No available iPhone simulator on this image."; exit 1; }
          echo "Testing on simulator $UDID"

          xcodebuild test \
            -project TinyTube.xcodeproj \
            -scheme TinyTube \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      # Unsigned on purpose, and unsigned is not a degraded mode here: CI cannot
      # sign for a free Apple ID at all, because free provisioning only happens
      # inside Xcode with a human present. AltStore and Sideloadly re-sign on
      # the way in, which is the supported path for that tier.
      - name: Archive
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project TinyTube.xcodeproj \
            -scheme TinyTube \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TinyTube.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # `xcodebuild -exportArchive` cannot help here: every export method it
      # knows wants a signing identity. An IPA is a zip with the .app under
      # Payload/, so build that directly — which is also exactly what the
      # sideloaders expect to be handed.
      - name: Package the IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/TinyTube.xcarchive/Products/Applications/TinyTube.app"
          test -d "$APP" || { echo "No .app in the archive — nothing to package."; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry TinyTube-unsigned.ipa Payload)
          echo "Built $(du -h build/TinyTube-unsigned.ipa | cut -f1) unsigned IPA"

      # dist/ is what both the artifact and the release are made of, so a reused
      # build and a fresh one are the same shape by the time anything reads them.
      #
      # build-tree.txt is what the reuse check compares, and version.json is
      # written HERE, beside the IPA it describes, rather than at publish time —
      # so a publish cannot pair one build's binary with another's manifest.
      # Nothing on iOS reads either one at runtime; there is no self-update. It
      # is for a person asking what the download link is currently serving.
      - name: Collect the build outputs
        run: |
          set -euo pipefail
          mkdir -p dist
          cp ios/build/TinyTube-unsigned.ipa dist/
          git rev-parse HEAD:ios > dist/build-tree.txt
          printf '{"build": %s, "commit": "%s", "builtAt": "%s"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/version.json
          cat dist/version.json dist/build-tree.txt

      - uses: actions/upload-artifact@v4
        with:
          name: tinytube-ipa
          path: dist/
          # A sideloaded build is only good for 7 days on the free tier, so an
          # artifact outliving that is storage spent on something nobody can
          # install any more.
          retention-days: 7

  # Publishes the IPA to a fixed ios-latest release, so there is one URL that
  # always serves the newest build.
  #
  # It exists because the repository is PRIVATE: its release assets 404 without
  # a credential, and an Actions artifact needs a logged-in browser and some
  # hunting through run pages to reach. The Worker holds a read-only token and
  # re-serves this release at /ios/TinyTube.ipa — the same trick /app already
  # uses for the APK, for a different reason. Android needs it so an installed
  # app can find its update; iOS needs it so a person can find the download.
  #
  # Ubuntu, always. The only thing that needs a Mac is compiling, and by the
  # time this runs that has either happened in ios-app or been skipped because
  # an identical build already existed.
  publish:
    needs: [changes, ios-app]
    # always(), or a skipped ios-app would skip this too — which is exactly the
    # reuse case, the one where publishing matters most.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.reuse == 'true' || needs['ios-app'].result == 'success')
    runs-on: ubuntu-latest
    steps:
      # From the offered run when it was reusable, from this run's own ios-app
      # otherwise. `gh run download` reads both the same way, which is why this
      # is one step and not two — the only difference is whose run id it names.
      - name: Fetch the build to publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FROM: ${{ needs.changes.outputs.reuse_run_id }}
        run: |
          set -euo pipefail
          RUN="${FROM:-$GITHUB_RUN_ID}"
          echo "Publishing the IPA built by run $RUN"
          gh run download "$RUN" --repo "$REPO" --name tinytube-ipa --dir dist
          test -s dist/TinyTube-unsigned.ipa
          ls -l dist

      - name: Publish to the ios-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view ios-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ios-latest --repo "$GITHUB_REPOSITORY" \
              --title "TinyTube for iOS (latest)" \
              --notes "Unsigned IPA auto-built from main. Sideload it with AltStore or Sideloadly; CI cannot sign for a free Apple ID." \
              --latest=false

          # version.json last and in its own call, matching android.yml. It is
          # not load-bearing here — nothing on iOS polls it, because nothing on
          # iOS self-updates — but the ordering costs nothing and the habit is
          # worth more than the exception: uploaded together, gh sends them
          # concurrently and the manifest goes live long before the IPA does.
          gh release upload ios-latest --repo "$GITHUB_REPOSITORY" --clobber \
            dist/TinyTube-unsigned.ipa
          gh release upload ios-latest --repo "$GITHUB_REPOSITORY" --clobber dist/version.json

          # What is actually in there — see the same block in android.yml for
          # why this is needed at all. Short version: a fixed tag's published_at
          # is the day it was created and never moves, so the list view will say
          # this release is weeks old while holding an IPA from this morning.
          #
          # The build numbers come from dist/version.json rather than from this
          # job's own run number, because on the reuse path THIS run compiled
          # nothing: the IPA was built by the pull request's run, and quoting
          # this run would name a build that never existed.
          BUILD=$(sed -n 's/.*"build"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' dist/version.json)
          BUILT=$(sed -n 's/.*"builtAt"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' dist/version.json)
          # version.json keeps UTC — it is the machine-readable record, and an
          # ISO instant with a Z on it means exactly one thing anywhere. The
          # NOTES are read by a person, so they get New York time, with %Z
          # printing EDT or EST so daylight saving looks after itself.
          #
          # Converted here rather than written that way upstream because this
          # job is ubuntu (GNU date parses the ISO string) while the build that
          # wrote it is macOS (BSD date does not, with the same flags). Falls
          # back to the raw value: a release note with an awkward timestamp
          # beats a publish that fails over one.
          BUILT_NYC=$(TZ='America/New_York' date -d "$BUILT" +'%Y-%m-%d %H:%M %Z' 2>/dev/null || echo "$BUILT")
          SHA=$(sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' dist/version.json)
          {
            echo "Unsigned IPA auto-built from main. Sideload it with AltStore or Sideloadly; CI cannot sign for a free Apple ID."
            echo
            echo "- **build $BUILD** · built $BUILT_NYC"
            echo "- from \`$SHA\`"
            echo
            echo "Download: <https://tinytube.vtlinh87.workers.dev/ios/TinyTube.ipa>"
            echo
            echo "_A sideloaded build on the free tier stops launching after 7 days. Re-sideload the same link to reset it — the URL never moves._"
            echo
            echo "_The date GitHub shows above this is when the \`ios-latest\` tag was first created, not when this IPA was built. The tag is fixed on purpose; its assets are replaced in place. The two lines above are what it is holding now._"
          } > release-notes.md
          gh release edit ios-latest --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

          {
            echo "Published build $BUILD to ios-latest."
            echo ""
            echo "Download: https://tinytube.vtlinh87.workers.dev/ios/TinyTube.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
