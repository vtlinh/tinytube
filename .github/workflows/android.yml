name: android

on:
  push:
    branches: [ "main" ]
    # android/** and NOTHING ELSE — not even this file. See the changes job.
    paths:
      - "android/**"
  # Pull requests build and test but never publish (the release steps are gated
  # on main below). Without this a PR carries no signal at all, and the tests
  # that guard which video ids can reach the player would first run only after
  # the merge that shipped them.
  #
  # Deliberately NOT path-filtered, unlike the push trigger above. A filtered
  # job that doesn't match simply never reports, and auto-merge.yml waits for
  # this run — so a catalog-only or docs-only PR would sit unmerged forever
  # with nothing to click. (The same silence blocks a required status check,
  # if branch protection is ever turned on.) Building those PRs costs a few
  # wasted minutes; not building them costs a PR that can never land.
  pull_request:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: >-
          A previous android run whose APK to publish as-is instead of building
          a new one. Honoured only if that run recorded building the exact tree
          this run checks out; otherwise it is ignored and the build runs
          normally. auto-merge.yml passes the run that just passed on the PR.
        required: false
        default: ""

# contents: write publishes the release. actions: read is what lets this run
# download an artifact belonging to a DIFFERENT run — the reuse path below.
# A permissions block REPLACES the defaults rather than adding to them, so every
# scope any job here touches has to be listed. Leaving one out does not fail
# loudly — the call 403s and, because the `changes` job below fails OPEN, the
# only symptom is that everything builds as if nothing were filtered. That is
# exactly what happened on the first run after the filtering landed, and it is
# the same way `checks` went missing from auto-merge.yml for four runs.
permissions:
  contents: write
  actions: read
  pull-requests: read   # the `changes` job asks which files a PR touched

# main: only one publish at a time. Two overlapping runs both clobber the fixed
# android-latest release, so a slower older run can land its APK on top of a
# newer one's version.json — leaving the manifest advertising a build the APK
# next to it isn't. Those runs QUEUE rather than cancel, because every merge is
# meant to ship and cancelling one drops its build on the floor.
#
# Pull requests get a group of their own, per PR. Sharing main's group would put
# branch builds in front of a publish that is waiting to ship, which is how
# novels ended up dropping branch builds entirely. Superseding a PR run IS
# right — nobody wants the results for the commit before the one they just
# pushed — so those cancel.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('android-pr-{0}', github.event.number) || 'android-latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which halves of the repository does this change actually touch?
  #
  # Seconds on ubuntu, and it decides whether the expensive jobs run at all. A
  # Worker-only change has no business spending a Gradle build or a macOS
  # runner, and before this it spent both on every pull request.
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      apk: ${{ steps.filter.outputs.apk }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # Anything but a pull request builds everything: a push to main and a
          # manual dispatch are both cases where somebody wants the artifact.
          if [ -z "${PR:-}" ]; then
            echo "Not a pull request — running everything."
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "apk=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Failing to read the file list runs everything. The costly direction
          # to be wrong in is the one where a break merges unnoticed.
          if ! FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>/dev/null); then
            echo "Could not list PR #$PR's files — running everything."
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "apk=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ANDROID=false
          APK=false
          WORKER=false
          for f in $FILES; do
            case "$f" in
              # android/** ONLY. Editing this workflow does not build the app
              # and does not publish one, which is the same definition the
              # reuse check already uses: `git rev-parse HEAD:android` covers
              # android/ and nothing else, so a workflow edit produces a tree
              # the check considers identical anyway. Counting it as an Android
              # change meant a release-note tweak shipped a fresh versionCode
              # to every installed device for a build that could not differ.
              #
              # The cost, stated: a change HERE that breaks the build merges
              # without ever having been built, and is discovered on the next
              # real Android change. That is the same hole CLAUDE.md already
              # names — anything the APK depends on has to live under android/
              # or it is invisible to the reuse check. If you change how the
              # APK is actually built, touch something under android/ in the
              # same commit, or dispatch this workflow by hand afterwards.
              android/*) ANDROID=true ;;
            esac
            # And separately: does this change what goes INTO the APK?
            #
            # ANDROID above decides whether to run the unit tests, which is a
            # different question and a cheaper one. A change under
            # app/src/test only needs `testReleaseUnitTest`; assembling a
            # release APK afterwards produces a binary nobody asked for and
            # nothing will install.
            #
            # The gradle files are in here even though they are not sources:
            # they set the versionCode and the dependencies, so they change the
            # artifact as surely as a .kt file does.
            #
            # android/signing.p12 used to be on this list and is gone from it
            # because the file is gone from the repository — the key is a secret
            # now, and a secret cannot appear in a PR's file list. Nothing here
            # can notice it changing, which is precisely why the build asserts
            # the certificate fingerprint on the finished APK instead.
            case "$f" in
              android/app/src/main/*|android/app/build.gradle.kts|\
              android/build.gradle.kts|android/gradle.properties|\
              android/settings.gradle.kts) APK=true ;;
            esac
            case "$f" in
              worker.js|worker.test.mjs|wrangler.toml) WORKER=true ;;
            esac
          done
          echo "android=$ANDROID (apk: $APK) worker=$WORKER"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"

  # The Worker's parsers, in a job of their own.
  #
  # They used to be a step inside `build`, which meant they only ran when the
  # APK was built — so gating `build` on android/** would have silently stopped
  # testing the Worker on exactly the changes that touch it. Splitting them out
  # is what lets `build` skip.
  #
  # Required by auto-merge BY NAME, like the others. It reads a rendering of
  # YouTube's own web app and is the piece most likely to break without anyone
  # touching it, so it has to be able to hold a merge.
  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test
      - name: The Worker still bundles
        run: npx wrangler deploy --dry-run

  # The job name is the check-run name, and auto-merge.yml requires this exact
  # string. Renaming it silently stops the merge gate waiting for Android.
  #
  # Skipped — not absent — when nothing under android/ changed. A job skipped by
  # `if` still REPORTS, as `skipped`, which auto-merge counts as passing; a
  # workflow skipped by a path filter reports nothing and would hang the merge
  # forever. That distinction is why the `pull_request` trigger above stays
  # unfiltered and the filtering happens here.
  build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publishing a merge normally means building code that has already been
      # built, minutes earlier, by the run that let it merge. This step looks
      # for that build and takes it, turning a ~2m30 publish into about half a
      # minute.
      #
      # Whether it is the same code is decided by a CONTENT HASH, not by
      # versions or timestamps or which commits are involved. Every build
      # records the hash of the source it was made from; if that matches what
      # is checked out here, the two builds would be identical in every way
      # that matters, and the tests that ran on it ran on this. If main moved
      # between the PR build and the merge, the hash differs and this falls
      # through to a full build — which is also exactly when the tests need
      # running again, because no run has seen the combined tree.
      #
      # So it can only ever skip work that was demonstrably already done. The
      # failure mode of the check is a needless rebuild, never a stale publish.
      #
      # The hash is git's own: `git rev-parse HEAD:android` is the SHA of the
      # android/ subtree, which git already computed and stored. Nothing has to
      # be committed to hold it and nothing has to be excluded from it, because
      # untracked files aren't in a tree in the first place — the two things
      # that make a checksum-file-in-the-repo version of this awkward.
      #
      # The SUBTREE rather than the whole repo, because android/ is everything
      # the APK and the tests are made from — build.gradle.kts and the keystore
      # included. A pull request that merges in between touching only README or
      # a workflow cannot change the APK, and shouldn't cost a rebuild.
      #
      # Trust boundary worth naming: this downloads an artifact produced by
      # another run of this repo, and takes that run's word for which tree it
      # built. On a repo whose workflows can be edited by a pull request from
      # outside — a fork PR, say — that word is worth what the fork's copy of
      # this file says it is. This repo doesn't take those, and dispatching
      # this workflow at all needs write access; if either ever changes, this
      # step needs to verify the run's own head commit rather than a file it
      # uploaded.
      - name: Reuse this tree's existing build, if there is one
        id: reuse
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -uo pipefail
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          give_up() { say "$*"; rm -rf dist; exit 0; }

          if ! gh run download "$RUN_ID" --repo "$REPO" --name tinytube-apk --dir dist; then
            give_up "Run $RUN_ID has no tinytube-apk artifact — building instead."
          fi

          BUILT=$(cat dist/build-tree.txt 2>/dev/null || true)
          HERE=$(git rev-parse HEAD:android)
          if [ -z "$BUILT" ] || [ "$BUILT" != "$HERE" ]; then
            give_up "Run $RUN_ID built android/ ${BUILT:-<unrecorded>}; main has $HERE — building instead."
          fi

          # The updater compares versionCode and nothing else, so the one thing
          # a reused APK must not do is carry a code that is already out there.
          # It is a run number, so it only fails to be higher if something odd
          # happened — but "something odd happened" is precisely when you want
          # the guard, and the cost of it firing is a rebuild.
          NEW=$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' dist/version.json)
          OLD=0
          if gh release download android-latest --repo "$REPO" \
               --pattern version.json --output published.json --clobber 2>/dev/null; then
            OLD=$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' published.json)
            rm -f published.json
          fi
          if [ -z "$NEW" ] || [ "$NEW" -le "${OLD:-0}" ]; then
            give_up "Run $RUN_ID's build is versionCode ${NEW:-<unreadable>}, but ${OLD:-0} is already published — building instead."
          fi

          say "Reusing run $RUN_ID's build: versionCode $NEW, tree $HERE. No rebuild needed."
          echo "reused=yes" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.reuse.outputs.reused != 'yes'
        with:
          distribution: temurin
          java-version: "17"

      # Caches the whole Gradle user home, which is where both the downloaded
      # 8.9 distribution and the local build cache live. Writes entries from
      # main and restores them on pull requests, so a PR build starts warm.
      #
      # Note that a publish which reuses an APK never reaches this step, so it
      # neither reads nor refreshes the cache. Main still writes it on every
      # rebuild — a merge that raced another, or a hand push — and GitHub only
      # evicts an entry after a week untouched, so the cost of a quiet week is
      # one cold build, not a permanent regression.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.reuse.outputs.reused != 'yes'
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Version name = "<year>.<week>.<patch>":
      #   year  — years since 2025, 1-indexed (2026 -> 1)
      #   week  — ISO week of the year, 1-indexed (matched to the ISO year)
      #   patch — running build within that week; restarts at 1 the first build
      #           of a new week, otherwise the previous published patch + 1
      #           (read back from the android-latest version.json)
      # The versionCode (GITHUB_RUN_NUMBER, applied in build.gradle.kts) is what
      # the in-app updater compares, so this string is display-only and may
      # reset freely.
      - name: Compute version name
        if: steps.reuse.outputs.reused != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          YEAR=$(( $(date -u +%G) - 2025 ))
          WEEK=$(( 10#$(date -u +%V) ))
          PATCH=1
          if gh release download android-latest --repo "$GITHUB_REPOSITORY" \
               --pattern version.json --output prev.json --clobber 2>/dev/null; then
            PREV=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' prev.json)
            PY=${PREV%%.*}; REST=${PREV#*.}; PW=${REST%%.*}; PP=${REST##*.}
            if [ "$PY" = "$YEAR" ] && [ "$PW" = "$WEEK" ] && [ -n "$PP" ]; then
              PATCH=$(( PP + 1 ))
            fi
            rm -f prev.json
          fi
          echo "APP_VERSION_NAME=${YEAR}.${WEEK}.${PATCH}" >> "$GITHUB_ENV"
          echo "Computed version name: ${YEAR}.${WEEK}.${PATCH}"

      # One invocation rather than two. Gradle starts a daemon and configures
      # the project per invocation, and doing that twice was costing most of a
      # minute for nothing.
      #
      # The tests run on every build that happens at all, including a publish.
      # That reads like duplicated work — auto-merge only merges a PR whose
      # android run was green — but the reuse step above is what removes the
      # duplication, and it removes the whole build rather than half of it.
      # Reaching here on a publish means the reuse was refused, which means no
      # run has tested this exact tree, which is exactly when skipping the
      # tests would be skipping the only check there is.
      # The signing key is not in the repository. It was, and removing it from
      # the tree would not have unpublished it — GitHub keeps pull-request refs
      # and 76 of them carried the file, fetchable by anyone once this is
      # public, with a history rewrite touching none of them. So it was rotated
      # rather than hidden. See README's "About that committed key".
      #
      # Only when an APK is actually being assembled: a tests-only run needs no
      # key, and demanding one would fail every docs-adjacent build.
      #
      # No fallback and no continue-on-error. build.gradle.kts refuses to
      # assemble an unsigned release anyway; this says so earlier and names the
      # reason.
      - name: Restore the signing keystore
        if: steps.reuse.outputs.reused != 'yes' && needs.changes.outputs.apk == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ANDROID_KEYSTORE_B64 is not set."
            echo "An APK signed with anything else installs on no phone running this app."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/signing.p12
          echo "Wrote android/signing.p12 ($(wc -c < android/signing.p12) bytes)"

      - name: Unit tests, and the release APK if this change can alter one
        if: steps.reuse.outputs.reused != 'yes'
        env:
          APK: ${{ needs.changes.outputs.apk }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # ONE gradle invocation either way: it starts a daemon and configures
          # the project per run, and doing that twice cost most of a minute.
          TASKS="testReleaseUnitTest"
          if [ "$APK" = "true" ]; then
            TASKS="$TASKS assembleRelease"
          else
            echo "Nothing here changes the APK — running the tests only."
          fi
          gradle -p android $TASKS

      # The property that decides whether a build can reach a phone at all.
      #
      # A wrong key does not fail a build. It produces a perfectly good APK
      # that Android refuses to install over the app already there, and nothing
      # else in this pipeline inspects a signature — the failure would surface
      # as "the update silently never applies", on every device at once.
      #
      # It is also what covers the gap the reuse hash cannot. That hash is the
      # SHA of android/, and the key no longer lives there, so replacing the
      # secret changes what ships without forcing a rebuild. Assert the property
      # on the artifact rather than inferring it from the tree.
      #
      # Not a secret: this is readable from any published APK.
      - name: Check the APK carries the expected signing certificate
        if: steps.reuse.outputs.reused != 'yes' && needs.changes.outputs.apk == 'true'
        env:
          EXPECTED: "D1A7D21D0ED4B393BAE007E1D7941258EC3D719FD69EB57F60D4F646C9F906D1"
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "No apksigner under ${SDK:-<unset>} — cannot verify what was just signed."
            exit 1
          fi
          GOT=$("$APKSIGNER" verify --print-certs \
                  android/app/build/outputs/apk/release/app-release.apk \
                | sed -n 's/.*SHA-256 digest: *//p' | head -1 | tr 'a-f' 'A-F')
          echo "expected $EXPECTED"
          echo "got      ${GOT:-<none>}"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "This APK is signed with the wrong key. Refusing to go any further."
            exit 1
          fi
          echo "Signing certificate matches."

      # Everything downstream reads dist/, so a reused build and a fresh one
      # are the same thing by the time anyone looks.
      #
      # version.json is written HERE, next to the APK it describes, rather than
      # at publish time. That is the point: the pair travels together, so a
      # publish cannot pick up one build's APK and another's manifest — the
      # failure the "upload version.json last" rule exists to bound. build-tree
      # records what this was made from, and is what the reuse check reads.
      - name: Collect the build outputs
        if: steps.reuse.outputs.reused != 'yes' && needs.changes.outputs.apk == 'true'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"${APP_VERSION_NAME}\"}" > dist/version.json
          git rev-parse HEAD:android > dist/build-tree.txt
          cat dist/version.json dist/build-tree.txt

      # Nothing to upload when no APK was built. The publish path is
      # unaffected: on main the filter above answers true for everything.
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.reused == 'yes' || needs.changes.outputs.apk == 'true'
        with:
          name: tinytube-apk
          path: dist/

      # main builds publish to a fixed release so the Worker always has a stable
      # asset to re-serve to installed apps.
      - name: Publish APK to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-latest --repo "$GITHUB_REPOSITORY" \
              --title "TinyTube (latest)" --notes "APK auto-built from main." --latest=false
          # version.json is what tells the app a new build exists, so it must
          # land LAST and in its own call. Uploaded together, gh sends the
          # assets concurrently and the 60-byte manifest goes live long before
          # the APK finishes going up — a window on every release where every
          # app that checks is told about a version it then fails to download.
          gh release upload android-latest --repo "$GITHUB_REPOSITORY" --clobber \
            dist/app-release.apk
          gh release upload android-latest --repo "$GITHUB_REPOSITORY" --clobber dist/version.json

          # What is actually in there, written into the release itself.
          #
          # GitHub's releases list prints a release's published_at, and for a
          # FIXED TAG that is the day the tag was first created and never moves
          # again — android-latest read "3 days ago" while holding an APK from
          # twenty minutes earlier. The date cannot be corrected: the only way
          # to move published_at is to toggle the release back to draft and
          # republish it, and a draft's asset URLs 404 — which is the exact path
          # every installed phone uses to fetch its update. A cosmetic date is
          # not worth a window where updating is broken.
          #
          # So the page says what the header can't. Costs one API call and is
          # the difference between a release that looks stale and one that
          # tells you what it is holding.
          #
          # AFTER the uploads, deliberately. version.json still lands last among
          # the ASSETS, which is what the "publish version.json last" rule is
          # about; notes are read by people and by nothing on a device, so
          # editing them afterwards cannot advertise a build that isn't up yet.
          CODE=$(sed -n 's/.*"versionCode"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' dist/version.json)
          NAME=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' dist/version.json)
          {
            echo "APK auto-built from main."
            echo
            echo "- **versionCode $CODE** · versionName $NAME"
            # New York time, because a person reads this line and "was that
            # before or after the thing I just fixed?" is the question it
            # answers. %Z prints EDT or EST, so the answer is unambiguous and
            # daylight saving looks after itself.
            echo "- built $(TZ='America/New_York' date +'%Y-%m-%d %H:%M %Z') from \`$GITHUB_SHA\`"
            echo
            echo "Install: <https://tinytube.vtlinh87.workers.dev/app/app-release.apk>"
            echo
            echo "_The date GitHub shows above this is when the \`android-latest\` tag was first created, not when this APK was built. The tag is fixed on purpose so installed apps have one URL that never moves; its assets are replaced in place. The two lines above are what it is holding now._"
          } > release-notes.md
          gh release edit android-latest --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
