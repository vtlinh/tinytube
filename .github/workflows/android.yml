name: android

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  # Pull requests build and test but never publish (the release steps are gated
  # on main below). Without this a PR carries no signal at all, and the tests
  # that guard which video ids can reach the player would first run only after
  # the merge that shipped them.
  #
  # Deliberately NOT path-filtered, unlike the push trigger above. A filtered
  # job that doesn't match simply never reports, and auto-merge.yml waits for
  # this run — so a catalog-only or docs-only PR would sit unmerged forever
  # with nothing to click. (The same silence blocks a required status check,
  # if branch protection is ever turned on.) Building those PRs costs a few
  # wasted minutes; not building them costs a PR that can never land.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# main: only one publish at a time. Two overlapping runs both clobber the fixed
# android-latest release, so a slower older run can land its APK on top of a
# newer one's version.json — leaving the manifest advertising a build the APK
# next to it isn't. Those runs QUEUE rather than cancel, because every merge is
# meant to ship and cancelling one drops its build on the floor.
#
# Pull requests get a group of their own, per PR. Sharing main's group would put
# branch builds in front of a publish that is waiting to ship, which is how
# novels ended up dropping branch builds entirely. Superseding a PR run IS
# right — nobody wants the results for the commit before the one they just
# pushed — so those cancel.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('android-pr-{0}', github.event.number) || 'android-latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches the whole Gradle user home, which is where both the downloaded
      # 8.9 distribution and the local build cache live. Writes entries from
      # main and restores them on pull requests, so a PR build starts warm.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Version name = "<year>.<week>.<patch>":
      #   year  — years since 2025, 1-indexed (2026 -> 1)
      #   week  — ISO week of the year, 1-indexed (matched to the ISO year)
      #   patch — running build within that week; restarts at 1 the first build
      #           of a new week, otherwise the previous published patch + 1
      #           (read back from the android-latest version.json)
      # The versionCode (GITHUB_RUN_NUMBER, applied in build.gradle.kts) is what
      # the in-app updater compares, so this string is display-only and may
      # reset freely.
      - name: Compute version name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          YEAR=$(( $(date -u +%G) - 2025 ))
          WEEK=$(( 10#$(date -u +%V) ))
          PATCH=1
          if gh release download android-latest --repo "$GITHUB_REPOSITORY" \
               --pattern version.json --output prev.json --clobber 2>/dev/null; then
            PREV=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' prev.json)
            PY=${PREV%%.*}; REST=${PREV#*.}; PW=${REST%%.*}; PP=${REST##*.}
            if [ "$PY" = "$YEAR" ] && [ "$PW" = "$WEEK" ] && [ -n "$PP" ]; then
              PATCH=$(( PP + 1 ))
            fi
            rm -f prev.json
          fi
          echo "APP_VERSION_NAME=${YEAR}.${WEEK}.${PATCH}" >> "$GITHUB_ENV"
          echo "Computed version name: ${YEAR}.${WEEK}.${PATCH}"

      # One invocation rather than two. Gradle starts a daemon and configures
      # the project per invocation, and doing that twice was costing most of a
      # minute for nothing.
      #
      # The publish run skips the tests, because they have already passed on
      # this code: auto-merge only merges a PR whose android run was green, and
      # then dispatches this. Running them again asks the same question twice.
      #
      # Only on the dispatch, though. A `push` to main reaches here having
      # passed nothing — GITHUB_TOKEN pushes trigger no workflows, so the only
      # thing that arrives by push is a person pushing to main by hand, which
      # is exactly when the tests are the only check there is.
      #
      # What this gives up, and it is not nothing: the PR was tested against
      # main as it stood WHEN THE RUN STARTED. If another PR merges in between,
      # what lands is a tree no run has tested. It cannot conflict — git would
      # have refused the merge — but two independently correct changes can
      # still disagree. One branch at a time makes that unlikely rather than
      # impossible. If it ever bites, dropping the condition below is the fix.
      - name: Unit tests and release APK
        env:
          TASKS: ${{ github.event_name == 'workflow_dispatch' && 'assembleRelease' || 'testReleaseUnitTest assembleRelease' }}
        run: gradle -p android $TASKS

      - uses: actions/upload-artifact@v4
        with:
          name: yt-kids-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # main builds publish to a fixed release so the Worker always has a stable
      # asset to re-serve to installed apps.
      - name: Publish APK to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"${APP_VERSION_NAME}\"}" > version.json
          gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-latest --repo "$GITHUB_REPOSITORY" \
              --title "Android app (latest)" --notes "APK auto-built from main." --latest=false
          # version.json is what tells the app a new build exists, so it must
          # land LAST and in its own call. Uploaded together, gh sends the
          # assets concurrently and the 60-byte manifest goes live long before
          # the APK finishes going up — a window on every release where every
          # app that checks is told about a version it then fails to download.
          gh release upload android-latest --repo "$GITHUB_REPOSITORY" --clobber \
            android/app/build/outputs/apk/release/app-release.apk
          gh release upload android-latest --repo "$GITHUB_REPOSITORY" --clobber version.json
