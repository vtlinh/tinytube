# The web app under web/ — copied from https://github.com/pathikrit/TinyTube —
# built and published to THIS repository's GitHub Pages
# (https://vtlinh.github.io/tinytube/).
#
# Deliberately NO pull_request trigger. auto-merge.yml listens for "android"
# and "ios" by name and re-checks that nothing else on the commit failed, so a
# check this workflow added to a PR could hold a merge hostage on a Pages
# concern. PRs that touch web/ merge on the app checks (which skip themselves,
# untouched) and the deploy happens from main, after.
#
# And nothing here can publish an APK or an IPA: android.yml and ios.yml watch
# android/** and ios/** on push, auto-merge's publish filter names the same
# two directories, and web/** appears in neither.
#
# One-time repository setup: Settings → Pages → Source = "GitHub Actions"
# (configure-pages below tries to do this itself via `enablement`; if the
# token is not allowed to, flip the toggle by hand once and re-run).
name: pages

on:
  push:
    branches: [ "main" ]
    # web/** plus this file. Unlike android.yml/ios.yml this filter MAY name
    # its own workflow: a Pages redeploy is idempotent — no versionCode, no
    # installed device watching — so the reason those filters exclude CI does
    # not apply here.
    #
    # This trigger only covers HAND-pushed commits. auto-merge merges with
    # GITHUB_TOKEN, whose pushes fire no workflow events (GitHub's recursion
    # guard), so an auto-merged web change reaches this workflow the same way
    # the app publishes do: auto-merge dispatches it explicitly, filtered to
    # the same paths listed here.
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      # The same version-advancement the Android app uses (android.yml's
      # "Compute version name"): <year-2025>.<iso week>.<patch>, patch
      # incrementing within a week. The previous version comes off the LIVE
      # site's version.json — stamped below — the way Android reads its
      # release's. Display-only, so a failed read just restarts the week at .1.
      - name: Compute version name
        run: |
          YEAR=$(( $(date -u +%G) - 2025 ))
          WEEK=$(( 10#$(date -u +%V) ))
          PATCH=1
          if curl -fsSL "https://vtlinh.github.io/tinytube/version.json" -o prev.json 2>/dev/null; then
            PREV=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' prev.json)
            PY=${PREV%%.*}; REST=${PREV#*.}; PW=${REST%%.*}; PP=${REST##*.}
            if [ "$PY" = "$YEAR" ] && [ "$PW" = "$WEEK" ] && [ -n "$PP" ]; then
              PATCH=$(( PP + 1 ))
            fi
            rm -f prev.json
          fi
          echo "BUILD_VERSION=${YEAR}.${WEEK}.${PATCH}" >> "$GITHUB_ENV"
          echo "Computed version name: ${YEAR}.${WEEK}.${PATCH}"
      - name: Build
        run: npm run build
        env:
          # Hardcoded rather than read off the event: workflow_dispatch and
          # push both have a repository, but keep the constant anyway so a
          # future trigger cannot build against a "//" base.
          BASE_PATH: /tinytube/
      # What the NEXT deploy's patch increment reads; `run` is the tiebreaker
      # for a person asking which build is serving.
      - name: Stamp version.json
        run: |
          printf '{"versionName": "%s", "run": %s}\n' "$BUILD_VERSION" "${{ github.run_number }}" > dist/version.json
          cat dist/version.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
