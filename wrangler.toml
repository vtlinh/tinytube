# Cloudflare Worker config. A git-connected Workers Build deploys worker.js on
# every push to main. Non-main branches get their own preview hostnames and
# cannot affect what installed apps talk to.
#
# The Worker serves the app's own release assets and nothing else. Curation
# lives on the device — see README.
#
# The `name` here decides the hostname, and the Android app has that hostname
# compiled in (android/.../Endpoints.kt).
#
# It was renamed to tinytube once, deliberately and together with
# the applicationId. That pairing is the only way it can be done: a renamed
# Worker cannot tell an installed app where it went — the app would have to be
# told by an update it can only fetch from the hostname it no longer has — so
# the app that talks to this one has to be a NEW install rather than an update.
#
# And note what changing this name actually DOES, because it was not what was
# expected. Cloudflare's git-connected build RENAMES the existing service; it
# does not stand a second one up beside it. The moment the new name deployed,
# the previous hostname started answering 404 — so every already
# installed app lost its uploads feed and its update check in the same instant,
# with no way to be told where to look. Their cached grids still play, because
# videos come from YouTube directly, but they learn nothing new ever again.
#
# That is the whole reason this file said "don't". Doing it left no bridge: the
# only recovery is installing the new app by hand on every phone. Don't rename
# this again.
#
# One-time setup, from this directory:
#   npx wrangler deploy                 # if the git-connected build isn't on
#   npx wrangler secret put GH_TOKEN    # fine-grained token, Contents:read, this repo
#
# Never put the token in this file — it is committed. `secret put` stores it on
# the worker, where the code reads it as env.GH_TOKEN.
name = "tinytube"
main = "worker.js"
compatibility_date = "2026-07-01"

[observability]
enabled = true

# The web app's cross-device sync (worker.js's SYNC section) stores per-account
# state in D1. This binding plus worker.js's GOOGLE_CLIENT_ID are what turn
# /sync/* on; without either it answers 503 and the web app hides its Sync row.
# A deploy naming a database that does not exist FAILS, which on the
# git-connected build means the old worker keeps serving — never commit a
# placeholder id here.
[[d1_databases]]
binding = "DB"
database_name = "tinytube"
database_id = "1374ae0d-c93a-4bd4-afb1-b04a3a483a26"

# The Worker refreshes its own channel cache. Daily, a little after the hour
# the web app's own weekly rebuild runs, so the two do not collide; each run
# tops up the stalest rows and stops. Browsers still refresh anything the cron
# has not reached, on demand — this only means they rarely wait for it.
[triggers]
crons = ["30 5 * * *"]
